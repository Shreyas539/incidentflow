server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Live stream: must not be buffered or cut off while idle.
  # (The notification service sends a keepalive comment every 25 seconds.)
  location /api/notifications/stream {
    proxy_pass http://notification-service:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/notifications {
    proxy_pass http://notification-service:8081;
    proxy_set_header Host $host;
  }

  # Everything else under /api belongs to the incident service.
  location /api/ {
    proxy_pass http://incident-service:8080;
    proxy_set_header Host $host;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
