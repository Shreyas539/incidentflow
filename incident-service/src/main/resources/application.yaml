spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:postgresql://localhost:5432/incidentflow
    username: incidentflow
    password: incidentflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  web:
    error:
      include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-0123456789}
    expiry-minutes: 30
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}