spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:postgresql://localhost:5432/incidentflow
    username: incidentflow
    password: incidentflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  web:
    error:
      include-stacktrace: never