spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:postgresql://localhost:5432/incidentflow
    username: incidentflow
    password: incidentflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  web:
    error:
      include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-0123456789}
    expiry-minutes: 30
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cache:
    enabled: true

  outbox:
    topic: incident-events
    batch-size: 50
    poll-interval-ms: 1000

